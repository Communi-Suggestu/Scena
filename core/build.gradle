plugins {
    alias(libs.plugins.tableau.maven.publishing)
}


platform {
    project {
        library()
        accessTransformers.from(rootProject.files('common/accesstransformer.cfg'))
    }
}


tableau {
    project {
        group = "com.communi-suggestu.scena"
        publisher = "communi-suggestu"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('communi-suggestu-scena')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}

dependencies {
    api "com.communi-suggestu.saecularia-caudices:core:${project.property('communi.suggestu.saecularia.caudices.version')}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.14.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}