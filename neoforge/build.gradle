plugins {
    id 'com.ldtteam.tableau.maven-publishing' version '0.0.80'
    id 'com.communi-suggestu.obumbratio' version '0.0.14'
}

platform {
    neoforge {
        version = "21.1.+"
        accessTransformers.from(rootProject.files("common/forge.accesstransformer.cfg"))
    }
}

tableau {
    project {
        group = "com.communi-suggestu.scena"
        publisher = "communi-suggestu"
        versioning {
            version = environmentVariable("VERSION")
                    .orElse(property("local.version"))
            suffix = ""
        }
    }
    maven {
        publishToLDTTeamMaven('communi-suggestu-scena')
        publishLocally()
        pom({
            usingMitLicense()
            usingGit()
        })
    }
}

shaders {
    enable()
    sodium()
    embeddium()
    neoforge()
}

dependencies {
    includedLibraries "com.communi-suggestu.saecularia-caudices:neoforge:${project.property('communi.suggestu.saecularia.caudices.version')}"
}
